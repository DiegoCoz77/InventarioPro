<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro | InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f6fa}.card{border-radius:.75rem}</style></head><body>
<div class="container py-3">
<div class="row justify-content-center"><div class="col-lg-7">
<nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Inicio</a></li><li class="breadcrumb-item"><a href="login.html">Login</a></li><li class="breadcrumb-item active">Registro de Usuario</li></ol></nav>
<div id="alerta"></div>
<div class="card shadow"><div class="card-body p-4">
<h3 class="text-center">Crear Nueva Cuenta</h3><div class="text-center mb-3"><span class="badge bg-success">Nuevo Usuario</span></div>
<form id="f" novalidate><div class="row g-3">
<div class="col-md-6"><label class="form-label">Nombres</label><input name="nombres" class="form-control" placeholder="Juan" required minlength="2"></div>
<div class="col-md-6"><label class="form-label">Apellidos</label><input name="apellidos" class="form-control" placeholder="Pérez" required minlength="2"></div>
<div class="col-12"><label class="form-label">Correo Electrónico</label><div class="input-group"><span class="input-group-text">@</span><input type="email" name="correo" class="form-control" placeholder="usuario@dominio.com" required></div></div>
<div class="col-md-6"><label class="form-label">Contraseña</label><input type="password" name="clave" class="form-control" required minlength="6"></div>
<div class="col-md-6"><label class="form-label">Confirmar Contraseña</label><input type="password" name="clave2" class="form-control" required><div class="invalid-feedback">Las contraseñas no coinciden.</div></div>
<div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="terminos" id="t" required><label class="form-check-label" for="t">Acepto los términos y condiciones del sistema</label></div>
<div class="col-12"><button class="btn btn-success w-100">Registrar Cuenta</button></div></div></form>
<hr><p class="text-center small mb-0">¿Ya tienes una cuenta? <a href="login.html"><strong>Iniciar Sesión</strong></a></p>
</div></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
mostrarAlerta('Complete el formulario para crear un nuevo usuario y acceder al sistema.');
enviar('f', d => {
  const us = leer('usuarios'), c = d.correo.trim().toLowerCase();
  if (us.some(u => u.correo === c)) return mostrarAlerta('Ese correo ya está registrado.', 'danger');
  us.push({ nombres: d.nombres.trim(), apellidos: d.apellidos.trim(), correo: c, clave: btoa(d.clave) });
  guardar('usuarios', us);
  location.href = 'login.html?t=success&m=' + encodeURIComponent('Cuenta creada. Ya puede iniciar sesión.');
});
</script></body></html>
