<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f6fa}.card{border-radius:.75rem}</style></head><body>
<div class="container py-3">
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
<div id="alerta"></div>
<div class="card shadow"><div class="card-body p-4 text-center">
<h2 class="fw-light">Acceso</h2><span class="badge bg-primary mb-3">Control de Usuarios</span>
<form id="f" class="text-start" novalidate>
<label class="form-label">Correo / Usuario</label>
<div class="input-group mb-3"><span class="input-group-text">@</span><input type="email" name="correo" class="form-control" placeholder="usuario@dominio.com" required><div class="invalid-feedback">Ingrese un correo válido.</div></div>
<label class="form-label">Contraseña</label><input type="password" name="clave" class="form-control mb-3" required minlength="6">
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="recordar" id="rec"><label class="form-check-label" for="rec">Recordar sesión en este equipo</label></div>
<button class="btn btn-primary w-100 mb-3">Ingresar al Panel</button></form>
<div class="d-flex justify-content-between small"><a href="registro.html">Registrar Nueva Cuenta</a><a href="#" onclick="alert('Contacte al administrador para restablecer su contraseña.');return false">Olvidé mi contraseña</a></div>
<a href="index.html" class="d-block mt-3 small">Volver al Inicio</a>
<p class="text-muted small mt-3 mb-0">Demo: admin@demo.com / 123456</p>
</div></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
mostrarAlerta(param('m') || 'Bienvenido. Ingrese sus credenciales.', param('t') || 'info');
enviar('f', (d) => {
  const u = leer('usuarios').find(x => x.correo === d.correo.toLowerCase() && x.clave === btoa(d.clave));
  if (!u) return mostrarAlerta('Correo o contraseña incorrectos', 'danger');
  (d.recordar ? localStorage : sessionStorage).setItem('sesion', JSON.stringify({ nombres: u.nombres, correo: u.correo }));
  location.href = 'panel.html';
});
</script></body></html>
