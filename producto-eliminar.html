<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eliminar Producto | InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f6fa}.card{border-radius:.75rem}</style></head><body>
<nav class="navbar navbar-dark bg-primary mb-3"><div class="container"><a class="navbar-brand" href="panel.html">InventarioPro</a>
<span class="text-white small" id="usuario"></span></div></nav><div class="container py-3">
<nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="panel.html">Panel de Control</a></li><li class="breadcrumb-item"><a href="productos.html">Productos</a></li><li class="breadcrumb-item active">Eliminar Producto</li></ol></nav>
<div class="alert alert-danger"><h5 class="alert-heading">¡Atención! Confirmación requerida</h5>Esta acción no se puede deshacer. Se eliminará el registro permanentemente de la base de datos.</div>
<div class="card bg-light mb-3"><div class="card-body"><h6 class="fw-bold">Detalles del Registro:</h6><div id="det"></div></div></div>
<button class="btn btn-danger" id="ok">Confirmar y Eliminar</button> <a href="productos.html" class="btn btn-secondary">Cancelar y Volver</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>exigirSesion();
const lista = leer('productos'), p = lista.find(x => x.sku === param('sku'));
if (!p) location.href = 'productos.html';
det.innerHTML = `<div><strong>SKU:</strong> ${esc(p.sku)}</div><div><strong>Producto:</strong> ${esc(p.nombre)}</div><div><strong>Categoría:</strong> ${esc(p.categorias)}</div>
<div><strong>Estado Actual:</strong> <span class="badge bg-${BADGE[p.estado]}">${p.estado}</span></div>`;
ok.onclick = () => { guardar('productos', lista.filter(x => x.sku !== p.sku)); location.href = 'productos.html?m=' + encodeURIComponent('Producto eliminado'); };
</script></body></html>
